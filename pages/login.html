<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In - FlareWise</title>
	<style>
		/* Navigation from index.html, adapted for this page */
		nav {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: 80px;
			background: rgba(255, 255, 255, 0.7);
			backdrop-filter: blur(20px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.3);
			z-index: 1000;
			display: flex;
			align-items: center;
			padding: 0 40px;
			box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
		}

		.nav-brand {
			font-size: 28px;
			font-weight: 800;
			background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -1px;
			margin-right: auto;
		}

		.nav-buttons {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.nav-buttons a {
			text-decoration: none;
			padding: 10px 24px;
			border-radius: 20px;
			font-weight: 600;
			font-size: 14px;
			transition: all 0.3s ease;
			white-space: nowrap;
		}

		.signup-btn {
			background: linear-gradient(135deg, #0288d1 0%, #0277bd 100%);
			color: white;
			box-shadow: 0 4px 18px rgba(2, 136, 209, 0.3);
			border: none;
		}

		.signup-btn:hover {
			background: linear-gradient(135deg, #01579b 0%, #004d7a 100%);
			box-shadow: 0 6px 24px rgba(1, 87, 155, 0.35);
			transform: translateY(-2px);
		}

		.error-message {
			background: rgba(244, 67, 54, 0.15);
			border: 1px solid rgba(244, 67, 54, 0.3);
			color: #c62828;
			padding: 14px 16px;
			border-radius: 12px;
			margin-bottom: 20px;
			font-weight: 500;
			text-align: center;
			display: none; /* Hidden by default */
			animation: slideDown 0.3s ease-out;
		}

		@keyframes slideDown {
			from { opacity: 0; transform: translateY(-10px); }
			to { opacity: 1; transform: translateY(0); }
		}
		
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
		}

		body {
			background: linear-gradient(135deg, #ffffff 0%, #e0f7ff 50%, #b3e5fc 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding-top: 80px; /* Space for fixed nav */
		}

		.container {
			background: rgba(255, 255, 255, 0.8);
			backdrop-filter: blur(15px);
			padding: 40px;
			border-radius: 16px;
			box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.4);
			width: 100%;
			max-width: 420px;
			text-align: center;
		}

		.container h1 {
			font-size: 28px;
			font-weight: 800;
			background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			margin-bottom: 10px;
		}

		.container h2 {
			font-size: 18px;
			color: #555;
			margin-bottom: 30px;
			font-weight: 500;
		}

		#login-form input[type="email"],
		#login-form input[type="password"] {
			width: 100%;
			padding: 14px 20px;
			margin-bottom: 15px;
			border-radius: 10px;
			border: 1px solid #ccc;
			font-size: 16px;
			transition: border-color 0.3s, box-shadow 0.3s;
		}

		#login-form input:focus {
			outline: none;
			border-color: #0288d1;
			box-shadow: 0 0 8px rgba(2, 136, 209, 0.2);
		}

		#login-form input[type="submit"] {
			width: 100%;
			padding: 14px 20px;
			border-radius: 10px;
			border: none;
			background: linear-gradient(135deg, #0288d1 0%, #0277bd 100%);
			color: white;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			box-shadow: 0 4px 18px rgba(2, 136, 209, 0.3);
			margin-top: 10px;
		}

		#login-form input[type="submit"]:hover {
			background: linear-gradient(135deg, #01579b 0%, #004d7a 100%);
			box-shadow: 0 6px 24px rgba(1, 87, 155, 0.35);
			transform: translateY(-2px);
		}

		.container p {
			margin-top: 25px;
			color: #666;
			font-size: 14px;
		}

		.container p a {
			color: #0277bd;
			font-weight: 600;
			text-decoration: none;
		}

		.container p a:hover {
			text-decoration: underline;
		}
	</style>
	<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
	<nav>
		<a href="../index.php" class="nav-brand" style="text-decoration: none;">FlareWise</a>
		<div class="nav-buttons">
			<a href="register.html" class="signup-btn">Sign Up</a>
		</div>
	</nav>

	<div class="container">
		<h1>Welcome to FlareWise</h1>
		<h2>Welcome Back</h2>

		<div id="error-container" class="error-message"></div>

		<div id="firebaseui-auth-container"></div>
    
		<p>
			Don't have an account? 
			<a href="register.html">Create a new account</a>
		</p>
	</div>

	<!-- Firebase SDKs (compat) -->
	<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script>
	<link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" />
	<script src="../assets/js/firebase-config.js"></script>

	<script>
		const auth = firebase.auth();
		let isCreatingSession = false;

		// Create the matching PHP session before opening a protected PHP page.
		// This prevents a Firebase-only login from bouncing between this page and
		// dashboard.php when the PHP session has expired.
		async function createPhpSession(firebaseUser) {
			const response = await fetch('../api/login_session.php', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					firebase_uid: firebaseUser.uid,
					email: firebaseUser.email || (firebaseUser.phoneNumber + '@phone.app'), // Fallback email for phone auth users
					fullname: firebaseUser.displayName || firebaseUser.phoneNumber || firebaseUser.email
				})
			});

			if (!response.ok) {
				const result = await response.json().catch(() => ({}));
				throw new Error(result.message || 'Unable to start your FlareWise session.');
			}
		}

		// Restore a PHP session for a Firebase user remembered by this browser.
		auth.onAuthStateChanged(async user => {
			if (!user || isCreatingSession) return;

			isCreatingSession = true;
			try {
				await createPhpSession(user);
				window.location.replace('dashboard.php');
			} catch (err) {
				await auth.signOut();
				document.getElementById('error-container').textContent =
					'Your sign-in session could not be restored. Please sign in again.';
				document.getElementById('error-container').style.display = 'block';
				isCreatingSession = false;
			}
		});

		// Initialize the FirebaseUI Widget using Firebase.
		var ui = new firebaseui.auth.AuthUI(firebase.auth());

		var uiConfig = {
			callbacks: {
				signInSuccessWithAuthResult: function(authResult, redirectUrl) {
					isCreatingSession = true;
					const firebaseUser = authResult.user;
					createPhpSession(firebaseUser)
						.then(() => {
							window.location.href = 'dashboard.php';
						})
						.catch(err => {
							isCreatingSession = false;
							const errorContainer = document.getElementById('error-container');
							errorContainer.textContent = err.message;
							errorContainer.style.display = 'block';
							auth.signOut();
						});
					// Return false to prevent FirebaseUI from redirecting automatically
					return false;
				},
				uiShown: function() {
					// The widget is rendered.
				}
			},
			signInFlow: 'popup',
			signInOptions: [
				// Leave the lines as is for the providers you want to offer your users.
				firebase.auth.EmailAuthProvider.PROVIDER_ID,
				firebase.auth.PhoneAuthProvider.PROVIDER_ID
			],
			tosUrl: '#',
			privacyPolicyUrl: '#'
		};

		// The start method will wait until the DOM is loaded.
		ui.start('#firebaseui-auth-container', uiConfig);

	</script>
</body>
</html>
